# general settings
name: Test-IRR-DiffSR
model_type: IRR_DiffSRGANModel
scale: 4
num_gpu: 1  
manual_seed: 0
datasets:
  test_1:
    name: My_AID_test-test
    type: SingleImageDataset
    dataroot_lq: /data/55d_1/IRR-DiffSR/data_samples/My_AID_dataset_total
    io_backend:
      type: disk
  test_2:
    name: My_WHU-RS19-test
    type: SingleImageDataset
    dataroot_lq: /data/55d_1/IRR-DiffSR/data_samples/My_WHU-RS19_total
    io_backend:
      type: disk

# network structures
network_g:
  type: IRR_DiffSR
  n_encoder_res: 9
  inp_channels: 3
  out_channels: 3
  dim: 64
  num_blocks: [13,1,1,1]
  num_refinement_blocks: 13
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.2
  bias: False
  LayerNorm_type: BiasFree
  n_denoise_res: 1
  linear_start: 0.1
  linear_end: 0.99
  timesteps: 4

# network structures
network_S1:
  type: IRR_Encoder
  n_encoder_res: 9
  inp_channels: 3
  out_channels: 3
  dim: 64
  num_blocks: [13,1,1,1]
  num_refinement_blocks: 13
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.2
  bias: False
  LayerNorm_type: BiasFree


# path
path:
  pretrain_network_S1: /data/55d_1/IRR-DiffSR/experiments/pretrain_model/IRR-DiffSR/IRR-DiffSR-S1.pth
  pretrain_network_g: /data/55d_1/IRR-DiffSR/experiments/pretrain_model/IRR-DiffSR/IRR-DiffSR-S2-net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: false
  ignore_resume_networks: network_S1



val:
  window_size: 8
  save_img: True
  suffix: ~ 
